# =====================================================================
#  ox_lib — réglage de l'interface « L-Studio » (rouge profond)
#
#  Installation :
#    1. Place ce fichier à côté de ton server.cfg
#    2. Dans server.cfg, AVANT "ensure ox_lib", ajoute la ligne :
#         exec ox_ui.cfg
#    3. Redémarre le serveur (ou : restart ox_lib)
#
#  Les couleurs sont écrites en rgb()/rgba() pour éviter tout souci
#  avec le caractère # dans les fichiers .cfg.
#  Dans rgba(r, g, b, a), le dernier nombre est l'opacité : 0 = invisible, 1 = opaque.
# =====================================================================


# --- Général ----------------------------------------------------------

setr ox_ui:theme "studio"
setr ox_ui:scale "auto"
setr ox_ui:width "390"
setr ox_ui:rows "9"
setr ox_ui:radius "6"
setr ox_ui:gap "6"
setr ox_ui:arrow ">>"


# --- Polices (incluses dans ox_lib) -----------------------------------

setr ox_ui:font "Poppins"
setr ox_ui:title_font "Poppins"


# --- Couleur principale -----------------------------------------------

setr ox_ui:accent "rgb(192, 38, 45)"


# --- En-tête ----------------------------------------------------------

# Rouge transparent : on devine le jeu derrière, comme sur la photo
setr ox_ui:header "rgba(150, 18, 24, 0.62)"
setr ox_ui:title "rgb(255, 255, 255)"
setr ox_ui:subtitle "rgb(233, 233, 236)"
setr ox_ui:subtitle_background "rgba(12, 12, 15, 0.82)"


# --- Corps du menu ----------------------------------------------------

setr ox_ui:background "rgba(12, 12, 15, 0.78)"
setr ox_ui:info "rgb(255, 255, 255)"
setr ox_ui:item "rgba(0, 0, 0, 0.45)"
setr ox_ui:item_border "rgba(255, 255, 255, 0.06)"
setr ox_ui:selected "rgba(192, 38, 45, 0.88)"
setr ox_ui:selected_text "rgb(255, 255, 255)"
setr ox_ui:text "rgb(236, 236, 239)"
setr ox_ui:text_disabled "rgb(138, 138, 146)"
setr ox_ui:description "rgb(217, 217, 222)"
setr ox_ui:bar "rgb(224, 56, 63)"
setr ox_ui:bar_background "rgba(255, 255, 255, 0.12)"
setr ox_ui:key "rgb(192, 38, 45)"
setr ox_ui:key_text "rgb(255, 255, 255)"
setr ox_ui:overlay "rgba(0, 0, 0, 0.45)"


# --- Notifications ----------------------------------------------------

setr ox_ui:notify_background "rgba(12, 12, 15, 0.85)"
setr ox_ui:notify_success "rgb(63, 191, 107)"
setr ox_ui:notify_error "rgb(224, 56, 63)"
setr ox_ui:notify_warning "rgb(242, 179, 61)"
setr ox_ui:notify_inform "rgb(233, 233, 236)"


