# =====================================================================
#  ox_lib — personnalisation de l'interface (thème Studio / RageUI)
#  Copie les lignes voulues dans ton server.cfg, AVANT "ensure ox_lib".
#  - Utilise toujours setr (la valeur doit être envoyée aux joueurs).
#  - Enlève le # devant une ligne pour l'activer.
#  - Ne mets que ce que tu veux changer : si tu ne règles que "accent",
#    l'en-tête, la sélection, les barres et les touches suivent automatiquement.
#  - Couleurs acceptées : "#a01616", "#a01616cc" (avec transparence),
#    "rgba(160, 22, 22, 0.85)", "rgb(...)", "red"...
#    Si une couleur "#..." n'est pas prise en compte, écris-la en rgb(...).
#  - Après modification : restart ox_lib. Avec une version récente de FiveM,
#    un setr tapé dans la console serveur s'applique aussi tout de suite.
#  - Les commentaires doivent rester sur leur propre ligne (jamais après un setr).
# =====================================================================

# --- Général ----------------------------------------------------------
# "studio" ou "rageui"
# setr ox_ui:theme "studio"
# "auto" ou un nombre (ex : 1.1)
# setr ox_ui:scale "auto"
# Largeur des menus en px (à 1080p)
# setr ox_ui:width "390"
# Options visibles avant défilement
# setr ox_ui:rows "10"
# Arrondi des coins en px (0 = carré)
# setr ox_ui:radius "4"
# Espace entre les options en px
# setr ox_ui:gap "7"
# Texte à droite des options ("none" = rien)
# setr ox_ui:arrow ">>"
# Image d'en-tête (URL ou nui://...)
# setr ox_ui:banner_image ""

# --- Polices ----------------------------------------------------------
# Police du texte (Poppins et Roboto sont incluses ; les autres polices Google Fonts sont chargées automatiquement)
# setr ox_ui:font "Poppins"
# Police du titre
# setr ox_ui:title_font "Poppins"
# Lien CSS d'une police perso (optionnel)
# setr ox_ui:font_url ""

# --- Couleur principale -----------------------------------------------
# Couleur d'accent (règle tout le reste par défaut)
# setr ox_ui:accent "#a01616"

# --- En-tête ----------------------------------------------------------
# Fond de l'en-tête
# setr ox_ui:header "rgba(160, 22, 22, 0.5)"
# Couleur du titre
# setr ox_ui:title "#ffffff"
# Texte du sous-titre + compteur
# setr ox_ui:subtitle "#ffffff"
# setr ox_ui:subtitle_background "rgba(14, 14, 18, 0.74)"

# --- Corps du menu ----------------------------------------------------
# Fond des panneaux
# setr ox_ui:background "rgba(14, 14, 18, 0.74)"
# Ligne d'info (ID / Métier)
# setr ox_ui:info "#f2f2f2"
# Fond d'une option
# setr ox_ui:item "rgba(0, 0, 0, 0.5)"
# Bordure d'une option
# setr ox_ui:item_border "rgba(255, 255, 255, 0.07)"
# Fond de l'option sélectionnée
# setr ox_ui:selected "rgba(160, 22, 22, 0.85)"
# Texte de l'option sélectionnée
# setr ox_ui:selected_text "#ffffff"
# Texte normal
# setr ox_ui:text "#f2f2f2"
# Texte d'une option désactivée
# setr ox_ui:text_disabled "#a39f94"
# Texte de la description
# setr ox_ui:description "#f2f2f2"
# Remplissage des barres / progression
# setr ox_ui:bar "#a01616"
# Fond des barres
# setr ox_ui:bar_background "rgba(255, 255, 255, 0.14)"
# Fond des touches [E]
# setr ox_ui:key "#a01616"
# Texte des touches
# setr ox_ui:key_text "#ffffff"
# Assombrissement derrière les fenêtres
# setr ox_ui:overlay "rgba(0, 0, 0, 0.35)"

